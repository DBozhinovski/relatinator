server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    add_header X-Content-Type-Options nosniff always;

    # Relative Location headers keep the proxy domain and port correct.
    absolute_redirect off;

    # Astro builds /docs/ as an alias of the library docs. Redirect it at the
    # HTTP level so browsers and crawlers leave the page.
    location = /docs/ {
        return 301 /docs/relatinator/;
    }

    # Hashed build assets never change, so cache them for a year.
    location /_astro/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-cache always;
        try_files $uri $uri/ =404;
    }
}
